[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-rag-service"
version = "0.1.0"
description = "Standalone knowledge ingestion and retrieval service"
readme = "rag/README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "charset-normalizer>=3.4,<4",
  "ftfy>=6.3,<7",
  "numpy>=2,<3",
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "Pillow>=11,<13",
  "pytesseract>=0.3.13,<1",
  "python-docx>=1.2,<2",
  "python-pptx>=1,<2",
  "qdrant-client>=1.16,<2",
  "sentence-transformers>=5.6,<5.7",
  "torch>=2.11,<2.12",
  "transformers>=4.57,<5",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.4,<2"]
ui = ["streamlit>=1.53,<2"]
api = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.30,<1",
]
test = [
  "build>=1.3,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "pytest>=9,<10",
  "reportlab>=4,<6",
]

[project.scripts]
rag-api = "rag.api.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag", "rag.*"]
exclude = ["rag.tests*", "rag.data*", "rag.Dataset*", "rag.Benchmark*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["rag/tests"]
addopts = "-ra"
markers = [
  "integration: uses real local parser or storage components",
  "model: loads a real embedding or reranking model",
  "slow: intentionally expensive test",
]
