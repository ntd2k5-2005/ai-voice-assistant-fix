[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eureka-llm-service"
version = "1.1.0"
description = "Stateless Qwen/Ollama LLM API for Eureka Voice Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ollama==0.6.2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.11,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.52,<1",
]
test = [
  "pytest>=9,<10",
  "httpx>=0.28,<1",
]
dev = [
  "eureka-llm-service[api,test]",
]

[project.scripts]
llm-api = "api.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm", "llm.*", "api", "api.*"]
exclude = ["tests*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
